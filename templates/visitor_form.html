<!DOCTYPE html>
<html>

<head>

<title>Temple Visitor Registration</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

<div class="card shadow">

<div class="card-body">

<h2 class="text-center mb-4">
🛕 Temple Visitor Registration
</h2>

<form action="/save" method="POST">

<div class="mb-3">

<label>Full Name</label>

<input
type="text"
name="name"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Mobile Number</label>

<input
type="text"
name="phone"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Purpose of Visit</label>

<input
type="text"
name="purpose"
class="form-control"
required>

</div>

<button class="btn btn-primary w-100">

Register Visitor

</button>

</form>

</div>

</div>

</div>

</body>

</html>
